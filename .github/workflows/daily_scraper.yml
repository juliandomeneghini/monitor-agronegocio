name: Executar Scraper Diario

on:
  schedule:
    # Roda todos os dias às 09:00 UTC (ajuste o horário conforme preferir)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite que você clique num botão para rodar manualmente no GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar script de scraping
        run: python src/scraper_cepea.py

      - name: Salvar dados atualizados no repositório
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Atualização automática dos dados diários via scraper"
          file_pattern: data/agri_climate.db